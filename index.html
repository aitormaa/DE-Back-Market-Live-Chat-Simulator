  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const maxW=600,ratio=Math.min(maxW/img.width,1);const c=document.createElement('canvas');c.width=img.width*ratio;c.height=img.height*ratio;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',0.65));};

});

  }
  return(<div className="min-h-screen bg-gray-100 flex items-center justify-center p-4"><div className="w-full max-w-sm"><button onClick={reset} className="mb-3 px-4 py-2 bg-white rounded-xl shadow text-sm">← Beenden</button><div className="bg-white rounded-2xl shadow-xl overflow-hidden"><div className="bg-green-500 text-white p-3"><h2 className="font-bold">Back Market Support</h2><p className="text-xs opacity-70">Sitzung: {code}</p></div>{scenario.hints&&(<div className="bg-yellow-50 border-b-2 border-yellow-200 p-3"><p className="text-xs font-bold text-yellow-800 mb-1">🎭 {scenario.mood}</p><ul className="text-xs text-yellow-700 space-y-0.5">{scenario.hints.map((h,i)=><li key={i}>• {h}</li>)}</ul></div>)}<div className="h-96 overflow-y-auto p-3 space-y-2 bg-gray-50">{isClosed&&<div className="bg-red-50 border-2 border-red-300 rounded-xl p-3 text-center text-red-700 font-bold text-sm">🔴 Agent hat Gespräch geschlossen</div>}{msgs.length===0&&(<div className="bg-amber-50 rounded-xl p-3 border"><p className="font-semibold text-sm">🎭 {scenario.cust.name}</p><p className="text-xs text-gray-500 mb-1">{scenario.cust.device} · {scenario.cust.order}</p><p className="text-xs text-orange-700 font-semibold">Sende deine Eröffnungsnachricht:</p><p className="text-xs text-gray-500 italic mt-1">💡 Vorschlag: « {scenario.msg} »</p></div>)}{msgs.map((m,i)=>m.messageType!=='NOTE'&&(<div key={i} className={`flex ${m.sender==='customer'?'justify-end':m.sender==='system'?'justify-center':'justify-start'}`}><div className={`px-3 py-2 rounded-xl max-w-xs text-sm ${m.sender==='customer'?'bg-green-500 text-white':m.sender==='system'?'automsg text-gray-600 text-xs':'bg-white border shadow-sm'}`}><p>{m.text}</p>{m.fileUrl&&<div className="mt-1">{m.fileType?.startsWith('image/')?<img src={m.fileUrl} alt={m.fileName} className="fp"/>:<a href={m.fileUrl} target="_blank" rel="noopener noreferrer" className="underline text-xs">📎 {m.fileName}</a>}</div>}</div></div>))}<div ref={chatEnd}/></div><div className="border-t p-3"><div className="flex gap-2"><input type="file" ref={fileRef} onChange={handleFile} accept="image/*,.pdf,.doc,.docx,.txt" style={{display:'none'}}/><button onClick={()=>fileRef.current?.click()} disabled={uploading||isClosed} className="text-lg disabled:opacity-40">{uploading?'⏳':'📎'}</button><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!isClosed&&handleSend()} disabled={isClosed} placeholder={isClosed?'Geschlossen':'Nachricht schreiben…'} className="flex-1 px-3 py-2 border-2 rounded-full text-sm disabled:bg-gray-100"/><button onClick={handleSend} disabled={isClosed} className="px-4 py-2 bg-green-500 text-white rounded-full text-sm font-semibold disabled:opacity-40">Senden</button></div></div></div></div></div>);
}
ReactDOM.render(React.createElement(App),document.getElementById('root'));
</script></body></html>
